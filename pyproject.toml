[tool.poetry]
name = "pygamesnake"
version = "1.1.0"
description = "Snake game build in python"
authors = ["BasCoding <basvanderlaan96@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.13.5"
pygame = "^2.6.0"
torch = {version = "^2.6.0", source = "pytorch-cpu"}
tqdm = "^4.70.0"
numpy = "^2.5.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
